[project]
name = "harnss-voice-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "speech-to-speech[paraformer]>=0.2.12",
    "sounddevice>=0.5.3",
    "websockets>=17.0",
]

[project.scripts]
harnss-voice-bridge = "harnss_voice_bridge:main"
harnss-voice-speech = "harnss_voice_bridge.speech_runtime:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
